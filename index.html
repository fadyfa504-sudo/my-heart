<!DOCTYPE html>  <html lang="ar" dir="rtl">  
<head>  
<meta charset="UTF-8">  
<meta name="viewport" content="width=device-width, initial-scale=1.0">  
<title>ليكي انتي ❤️</title>  
<style>  
body{margin:0;height:100vh;display:flex;justify-content:center;align-items:center;background:linear-gradient(135deg,#ff9a9e,#fecfef);font-family:'Cairo',sans-serif;overflow:hidden}  
.card{background:white;padding:40px;border-radius:25px;box-shadow:0 20px 60px rgba(0,0,0,0.15);text-align:center;max-width:400px;width:90%;animation:float 3s ease-in-out infinite}  
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}  
h1{color:#ff4d6d;font-size:28px}  
input{width:90%;padding:12px 15px;border-radius:30px;border:2px solid #ff9a9e;outline:none;text-align:center;font-size:18px;margin-top:20px}  
button{margin-top:15px;padding:12px 30px;border:none;border-radius:30px;background:#ff4d6d;color:white;font-size:18px;cursor:pointer;transition:0.3s}  
button:hover{background:#ff2e55;transform:scale(1.05)}  
#love{display:none}  
#love h2{color:#ff4d6d;font-size:26px;line-height:1.8}  
.heart{font-size:60px;animation:beat 1s infinite}  
@keyframes beat{0%,100%{transform:scale(1)}50%{transform:scale(1.2)}}  
#error{color:red;display:none;margin-top:10px}  
</style>  
</head>  
<body>  
<div class="card" id="loginBox">  
<div class="heart">❤️</div>  
<h1>فيه رسالة سرية ليكي</h1>  
<p>اكتبي الباسورد عشان تشوفيها</p>  
<input type="text" id="pass" placeholder="اكتبي الباسورد هنا">  
<button onclick="check()">افتحي الرسالة 🔓</button>  
<p id="error">الباسورد غلط يا قمر حاولي تاني 🥺</p>  
</div>  <div class="card" id="love">  
<div class="heart">💖</div>  
<h2>  
انتي اغلي وأهم حاجة ف حياتي ♥️<br>  
بحبك ي نور عيني ♥️<br>  
اتمني نفضل طول العمر سوا 🫠🥹♥️  
</h2>  
<p style="margin-top:20px;color:#888">15/12/2002 - يوم مميز ❤️</p>  
</div>  <script>  
function check(){  
  const p = document.getElementById('pass').value.trim();  
  if(p === "15/12/2002"){  
    document.getElementById('loginBox').style.display='none';  
    document.getElementById('love').style.display='block';  
  } else {  
    document.getElementById('error').style.display='block';  
  }  
}  
</script>  </body>  
</html>
